name: Generate and Publish Product Feeds

on:
  # Run on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'  # At minute 0 past every 6th hour

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main (optional - remove if you don't want this)
  push:
    branches:
      - main
    paths:
      - 'generate_feeds.py'
      - 'channel_mappings.yaml'
      - 'config.yaml'

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate feeds
        run: |
          python generate_feeds.py
        env:
          # Shopify OAuth credentials (shared across all stores)
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: 1

      - name: Upload feed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: product-feeds
          path: feeds/
          retention-days: 30
        if: always()  # Upload even if previous steps fail

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: generate-feeds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
