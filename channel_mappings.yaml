# Map Shopify product_type to Google product category (numeric IDs)
# Full taxonomy: https://www.google.com/basepages/producttype/taxonomy-with-ids.en-US.txt
product_type_categories:
  rainwear: "3066"        # Apparel & Accessories > Clothing > Outerwear > Rain Suits
  socks: "209"            # Apparel & Accessories > Clothing > Underwear & Socks > Socks
  measurement tools: "138"  # Business & Industrial > Retail
  care products: "1933"   # Apparel & Accessories > Shoe Accessories
  default: "187"          # Apparel & Accessories > Shoes

channels:
  google:
    fields:
      - id: variant.id
      - item_group_id: id
      - title: title
      - description: body_html
      - link: "https://{customer_domain}/products/{handle}?variant={variant.id}"
      - image_link: images[0].src
      - additional_image_link: additional_images
      - availability: availability
      - price: price
      - sale_price: sale_price
      - brand: "bisgaard"
      - gtin: variant.barcode
      - mpn: variant.sku
      - condition: "new"
      - product_type: product_type
      - google_product_category: google_product_category
      - color: metafields.custom.color_name
      - size: size
      - age_group: "kids"
      - gender: "unisex"
      - material: metafields.custom.lining_material
      - product_highlight:
          water_resistant: "Water resistant"
          removable_insole: "Removable insole"
          tex_membrane: "TEX membrane"
          barefoot: "Barefoot friendly"
      - custom_label_0: metafields.custom.seasons
      - custom_label_1: collections
  meta:
    fields:
      - id: variant.id
      - item_group_id: id
      - title: title
      - description: body_html
      - link: "https://{customer_domain}/products/{handle}?variant={variant.id}"
      - image_link: images[0].src
      - additional_image_link: additional_images
      - availability: availability
      - price: price
      - sale_price: sale_price
      - brand: "bisgaard"
      - condition: "new"
      - product_type: product_type
      - google_product_category: google_product_category
      - color: metafields.custom.color_name
      - size: size
      - material: metafields.custom.lining_material
      - product_highlight:
          water_resistant: "Water resistant"
          removable_insole: "Removable insole"
          tex_membrane: "TEX membrane"
          barefoot: "Barefoot"
      - custom_label_0: metafields.custom.seasons
      - custom_label_1: collections
