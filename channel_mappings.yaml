# Map Shopify product_type to Google product category
# See: https://support.google.com/merchants/answer/6324436
product_type_categories:
  rainwear: "Apparel & Accessories > Clothing > Outerwear > Rain Suits & Raincoats"
  socks: "Apparel & Accessories > Clothing > Underwear & Socks > Socks"
  measurement tools: "Business & Industrial > Retail > Foot Measuring Devices"
  care products: "Apparel & Accessories > Shoe Accessories > Shoe Care & Tools"
  # Default: everything else is children's shoes
  default: "Apparel & Accessories > Shoes > Kids Shoes"

channels:
  google:
    fields:
      - id: variant.id
      - item_group_id: id
      - title: title
      - description: body_html
      - link: "https://{customer_domain}/products/{handle}?variant={variant.id}"
      - image_link: images[0].src
      - additional_image_link: additional_images
      - availability: availability
      - price: "{variant.price} {currency}"
      - sale_price: "{variant.compare_at_price} {currency}"
      - brand: "'bisgaard'"
      - gtin: variant.barcode
      - mpn: variant.sku
      - condition: "'new'"
      - product_type: product_type
      - google_product_category: google_product_category
      - color: color
      - size: size
      - age_group: "'kids'"
      - gender: "'unisex'"
      - material: metafield
      - product_highlight: metafield
      - custom_label_0: metafield
      - custom_label_1: product_type
  meta:
    fields:
      - id: variant.id
      - item_group_id: id
      - title: title
      - description: body_html
      - link: "https://{customer_domain}/products/{handle}?variant={variant.id}"
      - image_link: images[0].src
      - additional_image_link: additional_images
      - availability: availability
      - price: "{variant.price} {currency}"
      - sale_price: "{variant.price} {currency}"
      - brand: "'bisgaard'"
      - condition: "'new'"
      - google_product_category: google_product_category
      - color: color
      - size: size
      - material: metafield
      - product_highlight: metafield
      - custom_label_0: metafield
      - custom_label_1: product_type